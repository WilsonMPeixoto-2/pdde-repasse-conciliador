version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "11:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    groups:
      npm-non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "11:30"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    groups:
      actions-non-major:
        update-types:
          - minor
          - patch
