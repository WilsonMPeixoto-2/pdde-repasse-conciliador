name: Public Data Live Verify Once

on:
  push:
    branches:
      - feat/public-data-pilot-20260815
    paths:
      - .github/workflows/public-data-live-verify-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Consultar atendimento prestação saldo e abertura de contas 2026
        run: node --import tsx scripts/verify-public-data-pilot.ts > public-data-live.json
      - name: Preservar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-data-live
          path: public-data-live.json
          if-no-files-found: ignore
          retention-days: 1
