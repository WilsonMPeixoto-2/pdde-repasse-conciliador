name: FNDE Public Probe Once

on:
  push:
    branches:
      - feat/public-data-pilot-20260815
    paths:
      - .github/workflows/fnde-public-probe-once.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Inspecionar relatórios públicos PDDEInfo
        run: node --import tsx scripts/probe-fnde-public-reports.ts fnde-public-reports-probe.json
      - name: Publicar resultado do probe
        uses: actions/upload-artifact@v4
        with:
          name: fnde-public-reports-probe
          path: fnde-public-reports-probe.json
          retention-days: 1
