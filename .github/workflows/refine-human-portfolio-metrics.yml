name: Refinar semântica das métricas humanas
# Reexecução após o boundary público remover runId dos fixtures do frontend.
on:
  push:
    branches:
      - feat/frontend-inteligencia-financeira-2026
    paths:
      - '.github/workflows/refine-human-portfolio-metrics.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/frontend-inteligencia-financeira-2026
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Aplicar semântica de referência única
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('backend/application/build-human-financial-view.ts')
          t = p.read_text()
          t = t.replace('  reportedBalanceCents: number;\n  applicationsCents: number;\n', '  reportedBalanceCents: number | null;\n  applicationsCents: number | null;\n', 1)
          old = """function buildPortfolioMetrics(\n  schools: readonly HumanFinancialSchoolView[],\n): HumanFinancialPortfolioMetrics {"""
          new = """function buildPortfolioMetrics(\n  schools: readonly HumanFinancialSchoolView[],\n  referenceDate: string | null,\n): HumanFinancialPortfolioMetrics {"""
          if old not in t: raise SystemExit('assinatura buildPortfolioMetrics não encontrada')
          t = t.replace(old, new, 1)
          old = """    for (const account of school.accounts) {\n      if (!account.latestPosition) continue;\n      accountsWithPosition += 1;\n      if (account.latestPosition.totalReportedBalanceCents !== null) {\n        reportedBalanceCents += account.latestPosition.totalReportedBalanceCents;\n      }\n      if (account.latestPosition.applications.totalCents !== null) {\n        applicationsCents += account.latestPosition.applications.totalCents;\n      }\n    }"""
          new = """    for (const account of school.accounts) {\n      if (!account.latestPosition || !referenceDate\n        || account.latestPosition.referenceDate !== referenceDate) continue;\n      accountsWithPosition += 1;\n      if (account.latestPosition.totalReportedBalanceCents !== null) {\n        reportedBalanceCents += account.latestPosition.totalReportedBalanceCents;\n      }\n      if (account.latestPosition.applications.totalCents !== null) {\n        applicationsCents += account.latestPosition.applications.totalCents;\n      }\n    }"""
          if old not in t: raise SystemExit('loop de contas não encontrado')
          t = t.replace(old, new, 1)
          old = """    reportedBalanceCents,\n    applicationsCents,\n  };"""
          new = """    reportedBalanceCents: referenceDate ? reportedBalanceCents : null,\n    applicationsCents: referenceDate ? applicationsCents : null,\n  };"""
          if old not in t: raise SystemExit('retorno de métricas não encontrado')
          t = t.replace(old, new, 1)
          t = t.replace('    metrics: buildPortfolioMetrics(schools),', '    metrics: buildPortfolioMetrics(schools, reference),', 1)
          p.write_text(t)

          p = Path('backend/application/current-human-financial-read-model.ts')
          t = p.read_text()
          t = t.replace('  reportedBalanceCents: z.number().int(),\n  applicationsCents: z.number().int(),\n', '  reportedBalanceCents: z.number().int().nullable(),\n  applicationsCents: z.number().int().nullable(),\n', 1)
          p.write_text(t)

          p = Path('src/product/types.ts')
          t = p.read_text()
          t = t.replace('  reportedBalanceCents: moneySchema,\n  applicationsCents: moneySchema,\n', '  reportedBalanceCents: moneySchema.nullable(),\n  applicationsCents: moneySchema.nullable(),\n', 1)
          p.write_text(t)
          PY
      - name: Verificar semântica financeira e build humano
        run: npx vitest run tests/unit/build-human-financial-history.test.ts tests/unit/current-human-financial-read-model.test.ts tests/unit/frontend-human-domain.test.ts
      - name: Remover workflow e publicar
        run: |
          rm .github/workflows/refine-human-portfolio-metrics.yml
          git config user.name 'Wilson Malafaia Peixoto'
          git config user.email 'wilsonmp2@gmail.com'
          git add backend/application/build-human-financial-view.ts backend/application/current-human-financial-read-model.ts src/product/types.ts .github/workflows/refine-human-portfolio-metrics.yml
          git commit -m 'fix: alinha metricas humanas a data de referencia'
          git push origin HEAD:feat/frontend-inteligencia-financeira-2026
