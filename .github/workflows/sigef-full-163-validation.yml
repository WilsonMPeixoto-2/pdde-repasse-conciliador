name: SIGEF Full 163 Validation
on:
  pull_request:
    paths:
      - 'backend/application/run-monitoring.ts'
      - 'backend/adapters/pddeinfo-http.ts'
      - 'backend/adapters/pddeinfo-html.ts'
      - 'backend/adapters/pddeinfo-normalizer.ts'
      - 'backend/adapters/sigef-public-statement.ts'
      - 'scripts/monitor-live-2026.ts'
      - 'scripts/monitor-all-163.ts'
      - '.github/workflows/sigef-full-163-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-163:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Extrair e organizar as 163 UEs em fontes reais
        run: node --import tsx scripts/monitor-all-163.ts
      - name: Preservar resultado integral
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sigef-full-163-2026
          path: |
            artifacts/monitor-all-163-2026.json
            .tmp/monitor-all-163/pddeinfo/**/*.html
            .tmp/monitor-all-163/sigef/**/*.html
          if-no-files-found: warn
          retention-days: 7
