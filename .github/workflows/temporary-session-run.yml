name: PDDE Temporary Session
run-name: PDDE Session ${{ inputs.session_id }}

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: Identificador opaco da sessão temporária
        required: true
        type: string
      ineps:
        description: "all ou lista de INEPs separados por vírgula"
        required: true
        default: all
        type: string

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Executar consulta temporária
        env:
          PDDE_SESSION_ID: ${{ inputs.session_id }}
        run: >-
          node --import tsx scripts/run-temporary-session.ts
          --ineps "${{ inputs.ineps }}"
          --workspace ".tmp/session-${{ inputs.session_id }}"
          --output-dir "artifacts/session-${{ inputs.session_id }}"
      - name: Publicar resultado efêmero
        uses: actions/upload-artifact@v7
        with:
          name: pdde-session-${{ inputs.session_id }}
          path: artifacts/session-${{ inputs.session_id }}/
          retention-days: 1
          if-no-files-found: error
