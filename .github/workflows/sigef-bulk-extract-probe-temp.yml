name: SIGEF Bulk Extract Probe Temp

on:
  pull_request:
    paths:
      - '.github/workflows/sigef-bulk-extract-probe-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Probe público do extrato consolidado PDDE setembro 2026
        shell: bash
        run: |
          set +e
          mkdir -p .tmp/sigef-bulk-probe
          URL="https://www.fnde.gov.br/sigefweb/index.php/extratos/gerar-extrato-bancario/ano/2026/programa/02/mes_ini/09/mes_fim/09"
          INDEX="https://www.fnde.gov.br/sigefweb/index.php/extratos/ajax/ano/2026"

          echo "== índice =="
          curl -sS -L --max-time 30 -D .tmp/sigef-bulk-probe/index.headers \
            -o .tmp/sigef-bulk-probe/index.json "$INDEX"
          echo "index_exit=$?"
          head -c 1000 .tmp/sigef-bulk-probe/index.json || true
          echo
          grep -o '"ID":"02"[^}]*' .tmp/sigef-bulk-probe/index.json | head -n 1 || true

          echo "== comparação mensal da mesma rota oficial =="
          for M in 04 05 06 07 08 09; do
            MONTH_URL="https://www.fnde.gov.br/sigefweb/index.php/extratos/gerar-extrato-bancario/ano/2026/programa/02/mes_ini/$M/mes_fim/$M"
            echo "-- mês $M --"
            curl -sS -L --max-time 45 --max-filesize 10485760 \
              -D ".tmp/sigef-bulk-probe/get-$M.headers" \
              -o ".tmp/sigef-bulk-probe/payload-$M.bin" "$MONTH_URL"
            CODE=$?
            SIZE=$(wc -c < ".tmp/sigef-bulk-probe/payload-$M.bin" 2>/dev/null || echo 0)
            echo "month=$M exit=$CODE size=$SIZE"
            grep -iE '^(HTTP/|Content-Type:|Content-Length:|Content-Disposition:)' ".tmp/sigef-bulk-probe/get-$M.headers" || true
          done
          cp .tmp/sigef-bulk-probe/payload-09.bin .tmp/sigef-bulk-probe/payload.bin 2>/dev/null || true

          python - <<'PY'
          from pathlib import Path
          import json, zipfile

          p = Path('.tmp/sigef-bulk-probe/payload.bin')
          report = {'exists': p.exists(), 'size': p.stat().st_size if p.exists() else 0}
          needles = [
              '05485540000126', '05.485.540/0001-26',
              '01226403000116', '01.226.403/0001-16',
              '01856391000103', '01.856.391/0001-03',
              '12558497000147', '12.558.497/0001-47',
              '17/09/2026', '15/09/2026', '2026-09-17', '2026-09-15',
              '024298', '023987',
          ]
          hits = {}
          if p.exists() and p.stat().st_size:
              raw = p.read_bytes()
              for enc in ('utf-8', 'latin-1'):
                  try:
                      text = raw.decode(enc)
                  except UnicodeDecodeError:
                      continue
                  for n in needles:
                      if n in text:
                          hits[n] = f'raw-{enc}'
              if zipfile.is_zipfile(p):
                  report['zip'] = True
                  try:
                      with zipfile.ZipFile(p) as z:
                          report['members'] = z.namelist()[:30]
                          for name in z.namelist():
                              if not name.endswith(('.xml','.txt','.csv')):
                                  continue
                              try:
                                  data = z.read(name)
                              except Exception:
                                  continue
                              for enc in ('utf-8','latin-1'):
                                  try:
                                      text = data.decode(enc)
                                  except UnicodeDecodeError:
                                      continue
                                  for n in needles:
                                      if n in text:
                                          hits[n] = name
                  except Exception as exc:
                      report['zip_error'] = str(exc)
              else:
                  report['zip'] = False
          report['needle_hits'] = hits
          Path('.tmp/sigef-bulk-probe/report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

          echo "== conteúdo textual inicial =="
          strings -n 8 .tmp/sigef-bulk-probe/payload.bin 2>/dev/null | head -n 120 || true

          # Probe investigativo: nunca torna o PR verde/vermelho por disponibilidade externa.
          exit 0
      - name: Preservar somente metadados do probe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sigef-bulk-extract-probe-temp
          path: |
            .tmp/sigef-bulk-probe/*.headers
            .tmp/sigef-bulk-probe/index.json
            .tmp/sigef-bulk-probe/report.json
          if-no-files-found: warn
          retention-days: 2
