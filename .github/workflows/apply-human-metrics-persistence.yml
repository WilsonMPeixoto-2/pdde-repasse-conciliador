name: Integrar métricas humanas na persistência
on:
  push:
    branches:
      - feat/frontend-inteligencia-financeira-2026
    paths:
      - '.github/workflows/apply-human-metrics-persistence.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/frontend-inteligencia-financeira-2026
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Atualizar leitura Supabase e teste PostgreSQL
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('backend/adapters/supabase-institutional-read-repository.ts')
          t = p.read_text()
          old = """import type {\n  CurrentHumanFinancialPortfolio,\n  CurrentHumanFinancialSchoolSnapshot,\n} from '../application/current-human-financial-read-model';"""
          new = """import {\n  humanPortfolioMetricsSchema,\n  type CurrentHumanFinancialPortfolio,\n  type CurrentHumanFinancialSchoolSnapshot,\n} from '../application/current-human-financial-read-model';"""
          if old not in t: raise SystemExit('import humano não encontrado')
          t = t.replace(old, new, 1)

          old = """const CURRENT_HUMAN_SNAPSHOT_COLUMNS = [\n  'fiscal_year', 'run_id', 'title', 'reference_label', 'school_count',\n  'sources', 'indicators',\n].join(',');"""
          new = """const CURRENT_HUMAN_SNAPSHOT_COLUMNS = [\n  'fiscal_year', 'run_id', 'title', 'reference_label', 'school_count',\n  'metrics', 'sources', 'indicators',\n].join(',');"""
          if old not in t: raise SystemExit('colunas humanas não encontradas')
          t = t.replace(old, new, 1)

          old = """    const snapshot = record(snapshotResult.data[0]);\n\n    const schoolResult = await this.client.from('current_human_financial_schools')"""
          new = """    const snapshot = record(snapshotResult.data[0]);\n    // Durante rollout de uma migration, um retrato legado sem métricas não deve\n    // virar zeros artificiais no produto. Ele é tratado como ainda não pronto.\n    if (snapshot.metrics === null || snapshot.metrics === undefined) return null;\n\n    const schoolResult = await this.client.from('current_human_financial_schools')"""
          if old not in t: raise SystemExit('âncora snapshot humano não encontrada')
          t = t.replace(old, new, 1)

          old = """      referenceLabel: z.string().min(1).parse(snapshot.reference_label),\n      schoolCount,\n      sources: z.array(humanSourceSchema).min(1).parse(snapshot.sources),"""
          new = """      referenceLabel: z.string().min(1).parse(snapshot.reference_label),\n      schoolCount,\n      metrics: humanPortfolioMetricsSchema.parse(snapshot.metrics),\n      sources: z.array(humanSourceSchema).min(1).parse(snapshot.sources),"""
          if old not in t: raise SystemExit('retorno humano não encontrado')
          t = t.replace(old, new, 1)
          p.write_text(t)

          p = Path('tests/integration/financial-intelligence-pglite.test.ts')
          t = p.read_text()
          old = """    '20260816020000_current_human_financial_read_model.sql',\n  ])"""
          new = """    '20260816020000_current_human_financial_read_model.sql',\n    '20260816073000_current_human_portfolio_metrics.sql',\n  ])"""
          if old not in t: raise SystemExit('lista de migrations não encontrada')
          t = t.replace(old, new, 1)

          old = """      referenceLabel: 'Posição financeira pública disponível até 30/06/2026',\n      schoolCount: 1,\n      sources:"""
          new = """      referenceLabel: 'Posição financeira pública disponível até 30/06/2026',\n      schoolCount: 1,\n      metrics: {\n        schoolCount: 1, accountsTotal: 0, accountsWithPosition: 0,\n        programmedCents: 0, paymentInformedCents: 0, creditLocatedCents: 0,\n        reportedBalanceCents: 0, applicationsCents: 0,\n      },\n      sources:"""
          if old not in t: raise SystemExit('fixture humanSnapshot não encontrado')
          t = t.replace(old, new, 1)

          old = """      expect(state.rows).toEqual([{\n        fiscal_run: 'monitoring-atomic-a',\n        human_run: 'monitoring-atomic-a',\n        school_count: 1,\n      }]);"""
          new = """      expect(state.rows).toEqual([{\n        fiscal_run: 'monitoring-atomic-a',\n        human_run: 'monitoring-atomic-a',\n        school_count: 1,\n      }]);\n      const humanMetrics = await database.query<{ metrics: Record<string, unknown> }>(\n        `select metrics from public.current_human_financial_snapshots where fiscal_year = 2026`,\n      );\n      expect(humanMetrics.rows[0].metrics).toMatchObject({ schoolCount: 1, accountsTotal: 0 });"""
          if old not in t: raise SystemExit('assertion atomic não encontrada')
          t = t.replace(old, new, 1)
          p.write_text(t)
          PY
      - name: Verificar persistência e contrato humano
        run: npx vitest run tests/unit/current-human-financial-read-model.test.ts tests/unit/supabase-current-monitoring-publisher.test.ts tests/integration/financial-intelligence-pglite.test.ts tests/unit/institutional-human-read-api.test.ts
      - name: Remover workflow temporário e publicar
        run: |
          rm .github/workflows/apply-human-metrics-persistence.yml
          git config user.name 'Wilson Malafaia Peixoto'
          git config user.email 'wilsonmp2@gmail.com'
          git add backend/adapters/supabase-institutional-read-repository.ts tests/integration/financial-intelligence-pglite.test.ts .github/workflows/apply-human-metrics-persistence.yml
          git commit -m 'feat: persiste metricas executivas do portfolio humano'
          git push origin HEAD:feat/frontend-inteligencia-financeira-2026
