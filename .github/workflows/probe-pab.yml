name: Probe Antonieta de Barros
on:
  push:
    branches:
      - test/sigef-month-window-2344
    paths:
      - 'scripts/probe-pab.ts'
      - 'scripts/probe-pab-deep.ts'
      - 'scripts/probe-pab-bbagil.ts'
      - 'scripts/probe-pab-bbagil-api.ts'
      - '.github/workflows/probe-pab.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Explorar catálogo e endpoints públicos
        run: node --import tsx scripts/probe-pab.ts
      - name: Explorar módulos e API internos públicos
        run: node --import tsx scripts/probe-pab-deep.ts
      - name: Localizar painel e API BB Gestão Ágil
        run: node --import tsx scripts/probe-pab-bbagil.ts
      - name: Identificar endpoint e parâmetros reais BB Gestão Ágil
        run: node --import tsx scripts/probe-pab-bbagil-api.ts
