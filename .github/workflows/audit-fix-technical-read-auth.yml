name: Audit Fix Technical Read Auth
on:
  push:
    paths:
      - '.github/workflows/audit-fix-technical-read-auth.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/revisao-tecnica-integral-2026-08-16
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Proteger somente rotas técnicas conhecidas
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Âncora não encontrada: {label}')
              return text.replace(old, new, 1)

          api = Path('backend/api/institutional-api.ts')
          s = api.read_text()

          s = replace_once(s,
          """        if (segments.length === 3 && segments[2] === 'portfolio') {\n          if (!dependencies.readService.getCurrentFiscalPortfolio) {""",
          """        if (segments.length === 3 && segments[2] === 'portfolio') {\n          if (!authorized(request, commandToken)) return errorResponse(401, 'Leitura administrativa não autorizada.');\n          if (!dependencies.readService.getCurrentFiscalPortfolio) {""",
          'current portfolio')

          s = replace_once(s,
          """        if (segments.length === 4 && segments[2] === 'schools') {\n          if (!dependencies.readService.getCurrentFiscalSchool) {""",
          """        if (segments.length === 4 && segments[2] === 'schools') {\n          if (!authorized(request, commandToken)) return errorResponse(401, 'Leitura administrativa não autorizada.');\n          if (!dependencies.readService.getCurrentFiscalSchool) {""",
          'current school')

          s = replace_once(s,
          """      if (segments.length === 2 && segments[1] === 'schools') {\n        if (request.method !== 'GET') return methodNotAllowed('GET');""",
          """      if (segments.length === 2 && segments[1] === 'schools') {\n        if (request.method !== 'GET') return methodNotAllowed('GET');\n        if (!authorized(request, commandToken)) return errorResponse(401, 'Leitura administrativa não autorizada.');""",
          'schools catalog')

          s = replace_once(s,
          """      if (segments[1] === 'schools' && segments.length >= 3) {\n        if (request.method !== 'GET') return methodNotAllowed('GET');""",
          """      if (segments[1] === 'schools' && segments.length >= 3) {\n        if (request.method !== 'GET') return methodNotAllowed('GET');\n        if (!authorized(request, commandToken)) return errorResponse(401, 'Leitura administrativa não autorizada.');""",
          'school technical reads')

          s = replace_once(s,
          """      if (segments.length === 2 && segments[1] === 'executions') {\n        if (request.method !== 'GET') return methodNotAllowed('GET');""",
          """      if (segments.length === 2 && segments[1] === 'executions') {\n        if (request.method !== 'GET') return methodNotAllowed('GET');\n        if (!authorized(request, commandToken)) return errorResponse(401, 'Leitura administrativa não autorizada.');""",
          'executions list')

          s = replace_once(s,
          """        if (request.method !== 'GET') return methodNotAllowed('GET');\n        const runId = segments[2];""",
          """        if (request.method !== 'GET') return methodNotAllowed('GET');\n        if (!authorized(request, commandToken)) return errorResponse(401, 'Leitura administrativa não autorizada.');\n        const runId = segments[2];""",
          'execution detail reads')

          s = replace_once(s,
          """      if (segments.length === 2 && segments[1] === 'findings') {\n        if (request.method !== 'GET') return methodNotAllowed('GET');""",
          """      if (segments.length === 2 && segments[1] === 'findings') {\n        if (request.method !== 'GET') return methodNotAllowed('GET');\n        if (!authorized(request, commandToken)) return errorResponse(401, 'Leitura administrativa não autorizada.');""",
          'findings list')
          api.write_text(s)

          p = Path('tests/unit/institutional-api.test.ts')
          t = p.read_text()
          if 'function adminGet(' not in t:
              marker = "async function json(response: Response): Promise<Record<string, any>> {\n"
              helper = """function adminGet(url: string): Request {\n  return new Request(url, { headers: { authorization: `Bearer ${COMMAND_TOKEN}` } });\n}\n\n"""
              t = replace_once(t, marker, helper + marker, 'adminGet helper')
          replacements = [
            ("new Request('http://localhost/api/schools')", "adminGet('http://localhost/api/schools')"),
            ("new Request(`http://localhost/api/schools/${school.inep}`)", "adminGet(`http://localhost/api/schools/${school.inep}`)"),
            ("new Request(\n      `http://localhost/api/schools/${school.inep}/history?limit=25&cursor=100`,\n    )", "adminGet(`http://localhost/api/schools/${school.inep}/history?limit=25&cursor=100`)"),
            ("new Request(`http://localhost/api/schools/${school.inep}/findings?review=true`)", "adminGet(`http://localhost/api/schools/${school.inep}/findings?review=true`)"),
            ("new Request('http://localhost/api/schools/99999999')", "adminGet('http://localhost/api/schools/99999999')"),
            ("new Request('http://localhost/api/executions?limit=20')", "adminGet('http://localhost/api/executions?limit=20')"),
            ("new Request('http://localhost/api/executions/run-1')", "adminGet('http://localhost/api/executions/run-1')"),
            ("new Request('http://localhost/api/findings?review=true')", "adminGet('http://localhost/api/findings?review=true')"),
            ("new Request('http://localhost/api/executions/run-1/artifacts')", "adminGet('http://localhost/api/executions/run-1/artifacts')"),
            ("new Request('http://localhost/api/executions/run-1/report')", "adminGet('http://localhost/api/executions/run-1/report')"),
          ]
          for old, new in replacements:
              t = t.replace(old, new)
          p.write_text(t)

          p = Path('tests/unit/institutional-current-fiscal-api.test.ts')
          t = p.read_text()
          if 'function adminGet(' not in t:
              marker = "describe('API do retrato fiscal corrente', () => {\n"
              helper = """function adminGet(url: string): Request {\n  return new Request(url, { headers: { authorization: `Bearer ${COMMAND_TOKEN}` } });\n}\n\n"""
              t = replace_once(t, marker, helper + marker, 'fiscal admin helper')
          t = t.replace("new Request('http://localhost/api/current/portfolio')", "adminGet('http://localhost/api/current/portfolio')")
          t = t.replace("new Request(`http://localhost/api/current/schools/${school.inep}`)", "adminGet(`http://localhost/api/current/schools/${school.inep}`)")
          t = t.replace("new Request('http://localhost/api/current/schools/99999999')", "adminGet('http://localhost/api/current/schools/99999999')")
          p.write_text(t)
          PY
      - name: Testes de autenticação e API
        run: npx vitest run tests/unit/institutional-api-read-auth.test.ts tests/unit/institutional-api.test.ts tests/unit/institutional-current-fiscal-api.test.ts tests/unit/institutional-human-read-api.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Remover workflow temporário e publicar
        run: |
          rm .github/workflows/audit-fix-technical-read-auth.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/api/institutional-api.ts tests/unit/institutional-api-read-auth.test.ts tests/unit/institutional-api.test.ts tests/unit/institutional-current-fiscal-api.test.ts .github/workflows/audit-fix-technical-read-auth.yml
          git commit -m 'fix: protege leituras técnicas da API institucional'
          git push origin HEAD:audit/revisao-tecnica-integral-2026-08-16
