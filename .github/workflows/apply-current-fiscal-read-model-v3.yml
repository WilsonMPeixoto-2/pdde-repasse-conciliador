name: Apply Current Fiscal Read Model v3

on:
  push:
    branches:
      - feat/current-fiscal-read-model
    paths:
      - .github/workflows/apply-current-fiscal-read-model-v3.yml
      - .github/scripts/apply-current-fiscal-read-model.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/current-fiscal-read-model
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Aplicar mudanças
        run: python .github/scripts/apply-current-fiscal-read-model.py
      - name: Instalar dependências
        run: npm ci
      - name: Validar antes de gravar
        run: npm run check
      - name: Gravar implementação
        shell: bash
        run: |
          git config user.name "Wilson Malafaia Peixoto"
          git config user.email "wilsonmp2@gmail.com"
          git add backend/application/current-fiscal-read-model.ts \
                  backend/application/institutional-read-repository.ts \
                  backend/application/institutional-read-service.ts \
                  backend/application/institutional-job-executor.ts \
                  backend/adapters/supabase-institutional-read-repository.ts \
                  backend/runtime/institutional-runtime.ts \
                  backend/api/institutional-api.ts
          git commit -m "feat: publica e serve retrato fiscal corrente de 2026"
          git push origin HEAD:feat/current-fiscal-read-model
