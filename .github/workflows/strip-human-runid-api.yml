name: Remover runId da API humana
on:
  push:
    branches:
      - feat/frontend-inteligencia-financeira-2026
    paths:
      - '.github/workflows/strip-human-runid-api.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/frontend-inteligencia-financeira-2026
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Aplicar boundary público humano
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/api/institutional-api.ts')
          t = p.read_text()
          old = """          const portfolio = await dependencies.readService.getCurrentHumanPortfolio();\n          return portfolio ? json(portfolio) : errorResponse(404, 'Retrato financeiro humano corrente ainda não publicado.');"""
          new = """          const portfolio = await dependencies.readService.getCurrentHumanPortfolio();\n          if (!portfolio) return errorResponse(404, 'Retrato financeiro humano corrente ainda não publicado.');\n          const publicPortfolio = { ...(portfolio as Record<string, unknown>) };\n          delete publicPortfolio.runId;\n          return json(publicPortfolio);"""
          if old not in t: raise SystemExit('rota de portfolio humano não encontrada')
          t = t.replace(old, new, 1)
          old = """          const school = await dependencies.readService.getCurrentHumanSchool(segments[4]);\n          return school ? json(school) : errorResponse(404, 'Retrato financeiro humano corrente da escola ainda não publicado.');"""
          new = """          const school = await dependencies.readService.getCurrentHumanSchool(segments[4]);\n          if (!school) return errorResponse(404, 'Retrato financeiro humano corrente da escola ainda não publicado.');\n          const publicSchool = { ...(school as Record<string, unknown>) };\n          delete publicSchool.runId;\n          return json(publicSchool);"""
          if old not in t: raise SystemExit('rota de escola humana não encontrada')
          t = t.replace(old, new, 1)
          p.write_text(t)

          p = Path('tests/unit/institutional-human-read-api.test.ts')
          t = p.read_text()
          t = t.replace("""    await expect(response.json()).resolves.toMatchObject({\n      title: 'Inteligência Financeira PDDE | 4ª CRE',""", """    const body = await response.json() as Record<string, unknown>;\n    expect(body).toMatchObject({\n      title: 'Inteligência Financeira PDDE | 4ª CRE',""", 1)
          t = t.replace("""      schools: [{ school: { inep: school.inep, sme: school.sme } }],\n    });\n    expect(readService.getCurrentHumanPortfolio)""", """      schools: [{ school: { inep: school.inep, sme: school.sme } }],\n    });\n    expect(body).not.toHaveProperty('runId');\n    expect(readService.getCurrentHumanPortfolio)""", 1)
          t = t.replace("""    await expect(found.json()).resolves.toMatchObject({ school: { inep: school.inep } });\n\n    const missing""", """    const foundBody = await found.json() as Record<string, unknown>;\n    expect(foundBody).toMatchObject({ school: { inep: school.inep } });\n    expect(foundBody).not.toHaveProperty('runId');\n\n    const missing""", 1)
          p.write_text(t)

          p = Path('tests/unit/frontend-human-domain.test.ts')
          t = p.read_text().replace("  runId: 'monitoring-full-2026',\n", '', 1)
          t = t.replace(" fiscalYear: 2026, runId: 'monitoring-full-2026',\n", " fiscalYear: 2026,\n", 1)
          p.write_text(t)
          PY
      - name: Verificar boundary humano
        run: npx vitest run tests/unit/institutional-human-read-api.test.ts
      - name: Remover workflow e publicar
        run: |
          rm .github/workflows/strip-human-runid-api.yml
          git config user.name 'Wilson Malafaia Peixoto'
          git config user.email 'wilsonmp2@gmail.com'
          git add backend/api/institutional-api.ts tests/unit/institutional-human-read-api.test.ts tests/unit/frontend-human-domain.test.ts .github/workflows/strip-human-runid-api.yml
          git commit -m 'feat: remove metadado de execucao da api humana'
          git push origin HEAD:feat/frontend-inteligencia-financeira-2026
