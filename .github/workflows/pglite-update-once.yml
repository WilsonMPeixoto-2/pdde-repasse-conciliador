name: PGlite Update Once

on:
  push:
    branches:
      - chore/pglite-0.5.5-20260815
    paths:
      - .github/workflows/pglite-update-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter branch
        uses: actions/checkout@v5
        with:
          ref: chore/pglite-0.5.5-20260815

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Atualizar somente PGlite
        run: |
          npm ci
          npm install --save-dev --save-exact @electric-sql/pglite@0.5.5
          npm run check
          test "$(node -p "require('./package.json').devDependencies['@electric-sql/pglite']")" = "0.5.5"
          test "$(node -p "require('./package-lock.json').packages['node_modules/@electric-sql/pglite'].version")" = "0.5.5"

      - name: Publicar package e lockfile na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --exit-code && exit 0
          git commit -m "chore: atualiza PGlite para 0.5.5"
          git push origin HEAD:chore/pglite-0.5.5-20260815
