name: Consolidar dependencias temp

on:
  push:
    branches:
      - maintenance/consolidar-deps-actions-2026-09-09

permissions:
  contents: write

jobs:
  consolidate:
    if: ${{ !contains(github.event.head_commit.message, '[deps-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: maintenance/consolidar-deps-actions-2026-09-09

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Atualizar dependencias nao major e regenerar lockfile
        run: |
          npm install --package-lock-only @supabase/supabase-js@2.116.0 inngest@4.19.0 motion@13.2.0 react-router-dom@7.18.3
          npm install --package-lock-only --save-dev @types/d3-shape@3.2.0 @types/react-dom@19.2.7 tsx@4.23.13
          npm ci

      - name: Verificar projeto
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Commit das dependencias geradas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao a registrar."
            exit 0
          fi
          git commit -m "[deps-sync] chore: consolidar dependencias nao major"
          git push origin HEAD:maintenance/consolidar-deps-actions-2026-09-09
