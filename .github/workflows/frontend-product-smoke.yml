name: Frontend Product Smoke 2026
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'shared/**'
      - 'public/data/**'
      - 'scripts/frontend-product-smoke.mjs'
      - 'scripts/frontend-published-smoke.mjs'
      - '.github/workflows/frontend-product-smoke.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'index.html'
      - 'playwright.config.ts'
      - 'tests/e2e/**'
  pull_request:
    paths:
      - 'src/**'
      - 'shared/**'
      - 'public/data/**'
      - 'scripts/frontend-product-smoke.mjs'
      - 'scripts/frontend-published-smoke.mjs'
      - '.github/workflows/frontend-product-smoke.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'index.html'
      - 'playwright.config.ts'
      - 'tests/e2e/**'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Gerar build do produto
        run: npm run build
      - name: Validar prontuário financeiro com cenário determinístico
        run: node scripts/frontend-product-smoke.mjs
      - name: Navegar e validar produto publicado desktop/mobile
        run: node scripts/frontend-published-smoke.mjs
      - name: Executar jornadas e acessibilidade no navegador real
        run: npx playwright test

      - name: Preservar screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-product-smoke-2026
          path: |
            artifacts/frontend-product-smoke/*.png
            artifacts/playwright-report/**
          if-no-files-found: warn
          retention-days: 7
