name: Upgrade dependencies 2026-08-15

on:
  push:
    branches:
      - chore/dependency-refresh-20260815
    paths:
      - .github/workflows/upgrade-dependencies-20260815.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/dependency-refresh-20260815
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Align Node engine and Vite 8 config
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          p.engines.node = '>=22.12.0';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          cat > vite.config.ts <<'EOF'
          import { defineConfig } from 'vite';

          export default defineConfig({
              base: './',
          });
          EOF
          npm install --package-lock-only
          npm ci

      - name: Full verification
        run: |
          npm run check
          npm run build 2>&1 | tee build.log
          if grep -q 'Invalid input options' build.log; then
            echo 'Vite configuration still contains an invalid option.' >&2
            exit 1
          fi
          npm ls vite tailwindcss @tailwindcss/postcss typescript lucide --depth=0
          node -e "const p=require('./package.json'); if(p.engines.node !== '>=22.12.0') process.exit(1); console.log('Node engine:', p.engines.node)"

      - name: Commit compatibility fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json vite.config.ts
          git diff --cached --check
          git commit -m 'chore: alinha Vite 8 e requisito do Node'
          git push origin HEAD:chore/dependency-refresh-20260815
