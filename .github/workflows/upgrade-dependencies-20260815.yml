name: Upgrade dependencies 2026-08-15

on:
  push:
    branches:
      - chore/dependency-refresh-20260815
    paths:
      - .github/workflows/upgrade-dependencies-20260815.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/dependency-refresh-20260815
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Inspect current and latest versions
        run: |
          echo '=== current ==='
          node -e "const p=require('./package.json'); console.log({vite:p.devDependencies.vite,tailwindcss:p.devDependencies.tailwindcss,typescript:p.devDependencies.typescript,lucide:p.dependencies.lucide})"
          echo '=== latest ==='
          npm view vite version
          npm view tailwindcss version
          npm view @tailwindcss/postcss version
          npm view typescript version
          npm view lucide version

      - name: Upgrade Vite TypeScript and Lucide
        run: |
          npm install -D vite@latest typescript@latest
          npm install lucide@latest
          npm run check

      - name: Upgrade Tailwind to v4 PostCSS integration
        run: |
          npm install -D tailwindcss@latest @tailwindcss/postcss@latest
          npm uninstall autoprefixer
          cat > postcss.config.js <<'EOF'
          export default {
            plugins: {
              '@tailwindcss/postcss': {},
            },
          }
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path('src/styles.css')
          s=p.read_text()
          old='@tailwind base;\n@tailwind components;\n@tailwind utilities;'
          if old not in s:
              raise SystemExit('Tailwind v3 directives not found as expected')
          p.write_text(s.replace(old, '@import "tailwindcss";', 1))
          PY
          npm run check

      - name: Record resulting versions
        run: |
          echo '=== resulting package versions ==='
          npm ls vite tailwindcss @tailwindcss/postcss typescript lucide --depth=0
          echo '=== npm outdated ==='
          npm outdated || true

      - name: Commit dependency refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json postcss.config.js src/styles.css
          git diff --cached --check
          git commit -m 'chore: atualiza toolchain de frontend'
          git push origin HEAD:chore/dependency-refresh-20260815
