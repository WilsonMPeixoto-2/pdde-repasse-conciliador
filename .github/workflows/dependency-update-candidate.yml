name: Dependency Update Candidate

on:
  push:
    branches:
      - chore/dependency-update-20260815
    paths:
      - .github/workflows/dependency-update-candidate.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/dependency-update-20260815
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install candidate majors
        run: |
          npm ci
          npm install lucide@1.31.0
          npm install -D vite@8.2.1 typescript@7.0.2 tailwindcss@4.3.3 @tailwindcss/postcss@4.3.3 @electric-sql/pglite@0.5.5
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.engines.node = '>=22.12.0';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          cat > postcss.config.js <<'EOF'
          export default {
            plugins: {
              '@tailwindcss/postcss': {},
              autoprefixer: {},
            },
          }
          EOF
          python - <<'PY'
          from pathlib import Path
          p = Path('src/styles.css')
          text = p.read_text()
          old = '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n'
          if old not in text:
              raise SystemExit('Diretivas Tailwind 3 não encontradas')
          p.write_text(text.replace(old, '@import "tailwindcss";\n', 1))
          PY
      - name: Candidate gate
        run: |
          npm run check
          rm -rf node_modules
          npm ci
          npm run check
          git diff --check
      - name: Commit candidate if green
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json postcss.config.js src/styles.css
          git commit -m 'chore: atualiza toolchain de desenvolvimento'
          git push origin HEAD:chore/dependency-update-20260815
