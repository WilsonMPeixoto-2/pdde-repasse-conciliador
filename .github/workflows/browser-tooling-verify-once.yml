name: Browser Tooling Verify Once

on:
  push:
    branches:
      - feat/acquisition-analytics-tooling-20260815
    paths:
      - .github/workflows/browser-tooling-verify-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências imutáveis
        run: npm ci
      - name: Instalar Chromium e dependências do sistema
        run: npx playwright install --with-deps chromium
      - name: Validar Crawlee Playwright e geração PDF reais
        run: npm run browser:verify
      - name: Executar verificação completa
        run: npm run check
      - name: Auditar dependências em severidade alta
        run: npm audit --audit-level=high
