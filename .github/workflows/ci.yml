name: Verificação contínua

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Testes, tipos e build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências imutáveis
        run: npm ci

      - name: Executar testes
        run: npm run test

      - name: Verificar tipos
        run: npm run typecheck

      - name: Gerar build
        run: npm run build
