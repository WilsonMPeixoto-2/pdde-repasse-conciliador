name: Verificação contínua

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Testes, tipos e build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências imutáveis
        run: npm ci

      - name: Executar testes
        run: |
          set -o pipefail
          npm run test 2>&1 | tee test-output.txt

      - name: Preservar diagnóstico dos testes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: test-output.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Verificar tipos
        run: npm run typecheck

      - name: Gerar build
        run: npm run build
