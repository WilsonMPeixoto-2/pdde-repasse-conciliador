name: Typecheck Diagnostic Once

on:
  push:
    branches:
      - feat/acquisition-analytics-tooling-20260815

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck com saída preservada
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck-output.txt
      - name: Preservar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-output
          path: typecheck-output.txt
          retention-days: 1
