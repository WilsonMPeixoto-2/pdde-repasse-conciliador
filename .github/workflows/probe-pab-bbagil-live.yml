name: Probe PAB BB Agil Live
on:
  push:
    branches:
      - test/sigef-month-window-2344
    paths:
      - 'scripts/probe-pab-bbagil-live.ts'
      - '.github/workflows/probe-pab-bbagil-live.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Consultar API BB Gestão Ágil sem autenticação
        run: node --import tsx scripts/probe-pab-bbagil-live.ts
