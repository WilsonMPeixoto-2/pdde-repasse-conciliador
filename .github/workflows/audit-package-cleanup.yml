name: Audit Package Cleanup
on:
  push:
    paths:
      - '.github/workflows/audit-package-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/revisao-tecnica-integral-2026-08-16
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Remover pacotes sem uso e corrigir alias fiscal
        run: |
          npm uninstall lucide tailwindcss @tailwindcss/postcss postcss
          npm pkg set 'scripts.monitor:fiscal:xlsx=node --import tsx scripts/export-fiscal-workbook.ts'
      - name: Verificar peer do fast-check
        run: npm ls fast-check @fast-check/vitest
      - name: Gate completo
        run: npm run check
      - name: Publicar limpeza
        run: |
          rm .github/workflows/audit-package-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/audit-package-cleanup.yml
          git commit -m 'chore: remove dependências inativas e corrige script fiscal'
          git push origin HEAD:audit/revisao-tecnica-integral-2026-08-16
