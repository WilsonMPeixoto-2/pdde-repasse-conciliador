name: Tooling Dependencies Once

on:
  push:
    branches:
      - feat/acquisition-analytics-tooling-20260815

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/acquisition-analytics-tooling-20260815

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install baseline
        run: npm ci

      - name: Install runtime tooling with exact pins
        run: npm install --save-exact crawlee playwright p-queue @duckdb/node-api unpdf inngest

      - name: Install property testing tooling with exact pins
        run: npm install --save-dev --save-exact fast-check @fast-check/vitest

      - name: Register explicit browser install command
        run: npm pkg set 'scripts.browser:install=playwright install chromium'

      - name: Show resolved versions
        run: |
          node -e "const p=require('./package.json'); for (const n of ['crawlee','playwright','p-queue','@duckdb/node-api','unpdf','inngest']) console.log(n, p.dependencies[n]); for (const n of ['fast-check','@fast-check/vitest']) console.log(n, p.devDependencies[n]);"

      - name: Verify baseline
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit manifests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: instala ferramentas de coleta e análise"
          git push origin HEAD:feat/acquisition-analytics-tooling-20260815
