name: Temporary Session Live Proof

on:
  push:
    branches:
      - feat/modo-sessao-temporaria-2026
    paths:
      - .github/workflows/temporary-session-proof.yml

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/modo-sessao-temporaria-2026
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Executar sessão real de uma unidade
        env:
          PDDE_SESSION_ID: proof-33069247-20260817
        run: >-
          node --import tsx scripts/run-temporary-session.ts
          --ineps 33069247
          --workspace .tmp/proof-session
          --output-dir artifacts/proof-session
      - name: Validar produtos da sessão
        run: |
          node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('artifacts/proof-session/session.json','utf8')); const h=JSON.parse(fs.readFileSync('artifacts/proof-session/human-financial.json','utf8')); if(!['COMPLETE','PARTIAL'].includes(s.status)) throw new Error('status inválido'); if(h.fiscalYear!==2026) throw new Error('exercício inválido'); if(h.schools.length!==1 || h.schools[0].school.inep!=='33069247') throw new Error('unidade incorreta'); const b=fs.readFileSync('artifacts/proof-session/inteligencia-financeira-pdde-4cre-2026.xlsx'); if(b[0]!==0x50 || b[1]!==0x4b) throw new Error('xlsx inválido'); console.log(JSON.stringify({status:s.status, schools:h.schools.length, indicators:h.indicators.length, accounts:h.schools[0].accounts.length, programs:h.schools[0].programs.length, workbookBytes:b.length}, null, 2));"
      - name: Publicar prova efêmera
        uses: actions/upload-artifact@v4
        with:
          name: temporary-session-live-proof-33069247
          path: artifacts/proof-session/
          retention-days: 1
          if-no-files-found: error
      - name: Remover workflow de prova
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-session-proof.yml
          git commit -m "test: remove prova temporaria de sessao"
          git push origin HEAD:feat/modo-sessao-temporaria-2026
