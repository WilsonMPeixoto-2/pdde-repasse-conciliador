name: Antonieta PDDE Product Probe

on:
  push:
    branches:
      - feat/temporal-coverage-sigef-export-2026-09-05
    paths:
      - '.github/workflows/antonieta-pdde-probe.yml'
      - 'backend/adapters/antonieta-data-product.ts'
      - 'scripts/probe-antonieta-data-product.ts'
      - 'backend/schools4cre.json'
  workflow_dispatch:
    inputs:
      product_id:
        description: 'ID do produto de dados Antonieta'
        required: false
        default: '24'

permissions:
  contents: read

jobs:
  probe:
    name: Probe produto PDDE ${{ matrix.product_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # push_product_ids: ['66', '70']
        product_id: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.product_id)) || fromJSON('["66","70"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Baixar artefato oficial com validação e retomada por faixas
        id: download
        shell: bash
        env:
          PRODUCT_ID: ${{ matrix.product_id }}
        run: |
          set -euo pipefail
          ROOT="artifacts/antonieta-download"
          LOCAL_API="${ROOT}/local-api/products/data-products/${PRODUCT_ID}"
          mkdir -p "${LOCAL_API}" "${ROOT}/chunks"

          BASE="https://www.fnde.gov.br/plataforma-antonieta-de-barros-api/products/data-products/${PRODUCT_ID}"
          METADATA_URL="${BASE}/artifact-metadata"
          ARTIFACT_URL="${BASE}/artifact"
          METADATA_FILE="${LOCAL_API}/artifact-metadata"
          ARTIFACT_FILE="${LOCAL_API}/artifact"

          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -H 'Accept: application/json' \
            -D "${ROOT}/metadata.headers" \
            -o "${METADATA_FILE}" \
            "${METADATA_URL}"

          EXPECTED_BYTES=$(node -e "const fs=require('node:fs'); const m=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if(!Number.isInteger(m.size)||m.size<1) process.exit(2); process.stdout.write(String(m.size));" "${METADATA_FILE}")
          echo "Tamanho oficial esperado: ${EXPECTED_BYTES} bytes"

          valid_artifact() {
            local file="$1"
            test -s "${file}" || return 1
            local actual
            actual=$(stat -c '%s' "${file}")
            test "${actual}" = "${EXPECTED_BYTES}" || return 1
            gzip -t "${file}"
          }

          DIRECT_OK=0
          for attempt in 1 2 3; do
            rm -f "${ARTIFACT_FILE}"
            echo "Download integral ${attempt}/3"
            if curl --fail --location --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 20 --max-time 1200 \
              -H 'Accept: application/gzip, application/octet-stream, */*' \
              -D "${ROOT}/direct-${attempt}.headers" \
              -o "${ARTIFACT_FILE}" \
              "${ARTIFACT_URL}"; then
              ACTUAL_BYTES=$(stat -c '%s' "${ARTIFACT_FILE}")
              echo "Recebidos ${ACTUAL_BYTES}/${EXPECTED_BYTES} bytes"
              if valid_artifact "${ARTIFACT_FILE}"; then
                DIRECT_OK=1
                break
              fi
            fi
            sleep $((attempt * 5))
          done

          if [ "${DIRECT_OK}" -ne 1 ]; then
            echo "Download integral não produziu gzip completo; tentando aquisição determinística por faixas."
            rm -f "${ARTIFACT_FILE}"
            CHUNK_SIZE=$((8 * 1024 * 1024))
            START=0
            INDEX=0
            RANGE_OK=1

            while [ "${START}" -lt "${EXPECTED_BYTES}" ]; do
              END=$((START + CHUNK_SIZE - 1))
              if [ "${END}" -ge "${EXPECTED_BYTES}" ]; then END=$((EXPECTED_BYTES - 1)); fi
              EXPECTED_CHUNK=$((END - START + 1))
              CHUNK_FILE="${ROOT}/chunks/$(printf '%04d' "${INDEX}").part"
              HEADER_FILE="${ROOT}/chunks/$(printf '%04d' "${INDEX}").headers"
              rm -f "${CHUNK_FILE}"

              echo "Faixa ${START}-${END} (${EXPECTED_CHUNK} bytes)"
              HTTP_CODE=$(curl --location --silent --show-error \
                --retry 5 --retry-all-errors --retry-delay 2 \
                --connect-timeout 20 --max-time 300 \
                --range "${START}-${END}" \
                -H 'Accept: application/gzip, application/octet-stream, */*' \
                -D "${HEADER_FILE}" \
                -o "${CHUNK_FILE}" \
                -w '%{http_code}' \
                "${ARTIFACT_URL}" || true)

              ACTUAL_CHUNK=$(stat -c '%s' "${CHUNK_FILE}" 2>/dev/null || echo 0)
              if [ "${HTTP_CODE}" = '206' ] && [ "${ACTUAL_CHUNK}" = "${EXPECTED_CHUNK}" ]; then
                cat "${CHUNK_FILE}" >> "${ARTIFACT_FILE}"
              elif [ "${START}" = '0' ] && [ "${HTTP_CODE}" = '200' ] && [ "${ACTUAL_CHUNK}" = "${EXPECTED_BYTES}" ]; then
                mv "${CHUNK_FILE}" "${ARTIFACT_FILE}"
                START="${EXPECTED_BYTES}"
                break
              else
                echo "Faixa inválida: HTTP ${HTTP_CODE}; bytes ${ACTUAL_CHUNK}/${EXPECTED_CHUNK}" >&2
                RANGE_OK=0
                break
              fi

              START=$((END + 1))
              INDEX=$((INDEX + 1))
            done

            if [ "${RANGE_OK}" -ne 1 ] || ! valid_artifact "${ARTIFACT_FILE}"; then
              ACTUAL_BYTES=$(stat -c '%s' "${ARTIFACT_FILE}" 2>/dev/null || echo 0)
              echo "Não foi possível obter o artefato completo: ${ACTUAL_BYTES}/${EXPECTED_BYTES} bytes." >&2
              exit 1
            fi
          fi

          ACTUAL_BYTES=$(stat -c '%s' "${ARTIFACT_FILE}")
          SHA256=$(sha256sum "${ARTIFACT_FILE}" | awk '{print $1}')
          echo "Artefato íntegro: ${ACTUAL_BYTES} bytes; sha256=${SHA256}"
          echo "local_root=${ROOT}/local-api" >> "${GITHUB_OUTPUT}"

      - name: Analisar artefato íntegro com o parser de produção
        if: steps.download.outcome == 'success'
        shell: bash
        env:
          PRODUCT_ID: ${{ matrix.product_id }}
          ANTONIETA_BASE_URL: 'http://127.0.0.1:8765/products'
        run: |
          set -euo pipefail
          ROOT="artifacts/antonieta-download"
          ARTIFACT_FILE="${ROOT}/local-api/products/data-products/${PRODUCT_ID}/artifact"

          python3 - "${ARTIFACT_FILE}" "${ROOT}/payload-diagnostic.json" <<'PY'
          import gzip
          import json
          import sys

          artifact, output = sys.argv[1:3]
          with gzip.open(artifact, 'rb') as source:
              prefix = source.read(65536)

          first_line = prefix.splitlines()[0] if prefix.splitlines() else b''
          diagnostic = {
              'decompressed_prefix_bytes': len(prefix),
              'first_line_bytes': len(first_line),
              'first_line_hex_prefix': first_line[:256].hex(),
              'utf8_bom': prefix.startswith(b'\xef\xbb\xbf'),
              'utf16le_bom': prefix.startswith(b'\xff\xfe'),
              'utf16be_bom': prefix.startswith(b'\xfe\xff'),
              'nul_bytes_in_prefix': prefix.count(b'\x00'),
              'delimiter_counts_first_line': {
                  'semicolon': first_line.count(b';'),
                  'comma': first_line.count(b','),
                  'tab': first_line.count(b'\t'),
                  'pipe': first_line.count(b'|'),
              },
              'quote_bytes_first_line': first_line.count(b'"'),
          }
          with open(output, 'w', encoding='utf-8') as target:
              json.dump(diagnostic, target, ensure_ascii=False, indent=2)
              target.write('\n')
          PY

          python3 -m http.server 8765 --directory "${ROOT}/local-api" > "${ROOT}/local-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} 2>/dev/null || true' EXIT
          sleep 1

          set +e
          node --import tsx scripts/probe-antonieta-data-product.ts \
            "${PRODUCT_ID}" \
            "artifacts/antonieta-pdde-product-${PRODUCT_ID}.json" \
            > >(tee "${ROOT}/parser.stdout.log") \
            2> >(tee "${ROOT}/parser.stderr.log" >&2)
          PARSER_STATUS=$?
          set -e

          printf '%s\n' "${PARSER_STATUS}" > "${ROOT}/parser-exit-code.txt"

          if [ "${PARSER_STATUS}" -ne 0 ]; then
            ERROR_LINE=$(sed -n 's/.* at line \([0-9][0-9]*\).*/\1/p' "${ROOT}/parser.stderr.log" | tail -n 1)
            if [[ "${ERROR_LINE}" =~ ^[0-9]+$ ]]; then
              echo "Preservando contexto da linha inválida ${ERROR_LINE}."
              python3 - "${ARTIFACT_FILE}" "${ERROR_LINE}" "${ROOT}/offending-record-context.json" <<'PY'
          import gzip
          import json
          import sys

          artifact, error_line_text, output = sys.argv[1:4]
          error_line = int(error_line_text)
          first = max(1, error_line - 2)
          last = error_line + 2
          rows = []
          with gzip.open(artifact, 'rt', encoding='utf-8', errors='replace', newline='') as source:
              for number, line in enumerate(source, start=1):
                  if number < first:
                      continue
                  if number > last:
                      break
                  raw = line.rstrip('\r\n')
                  rows.append({
                      'line': number,
                      'utf8_bytes': len(raw.encode('utf-8')),
                      'semicolon_count': raw.count(';'),
                      'quote_count': raw.count('"'),
                      'text': raw,
                  })
          with open(output, 'w', encoding='utf-8') as target:
              json.dump({
                  'error_line': error_line,
                  'context_first_line': first,
                  'context_last_line': last,
                  'rows': rows,
              }, target, ensure_ascii=False, indent=2)
              target.write('\n')
          PY
            fi
          fi

          exit "${PARSER_STATUS}"

      - name: Publicar resultado e diagnóstico de transporte
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: antonieta-pdde-product-${{ matrix.product_id }}
          path: |
            artifacts/antonieta-pdde-product-${{ matrix.product_id }}.json
            artifacts/antonieta-download/**/*.headers
            artifacts/antonieta-download/local-api/products/data-products/${{ matrix.product_id }}/artifact-metadata
            artifacts/antonieta-download/local-server.log
            artifacts/antonieta-download/payload-diagnostic.json
            artifacts/antonieta-download/offending-record-context.json
            artifacts/antonieta-download/parser.stdout.log
            artifacts/antonieta-download/parser.stderr.log
            artifacts/antonieta-download/parser-exit-code.txt
          if-no-files-found: warn
          retention-days: 7
