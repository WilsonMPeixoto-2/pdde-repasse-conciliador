name: Dependency Lock Refresh
on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-lock-refresh.yml
permissions:
  contents: write
jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Regenerar package-lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commitar lockfile atualizado
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json já está sincronizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh dependency lockfile"
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
